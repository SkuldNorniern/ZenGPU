[package]
name = "zengpu-zsl"
description = "ZenGPU shader proc-macro internals: ZSL token glue over zengpu-zslc."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["spirv"]
spirv = ["zengpu-zslc/spirv"]
hip = ["zengpu-zslc/hip"]
cuda = ["zengpu-zslc/cuda"]
metal = ["zengpu-zslc/metal"]
dx = ["zengpu-zslc/dx"]
# Enables every emitter in the glue and in zengpu-zslc (whose test suite these gate).
test-all-backends = ["spirv", "hip", "cuda", "metal", "zengpu-zslc/test-all-backends"]

[lib]
proc-macro = true

# No external parser deps: ZSL token parsing and the macro glue use only the
# builtin `proc_macro` token stream. (No syn / quote / proc-macro2.)
[dependencies]
zengpu-zslc.workspace = true
