name: tagged-release

on:
  push:
    tags:
      - "v*"

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish tagged release
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag and workspace versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import json, os, subprocess
          metadata = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"], text=True))
          members = set(metadata["workspace_members"])
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          mismatches = [f"{p['name']}={p['version']}" for p in metadata["packages"] if p["id"] in members and p["version"] != expected]
          if mismatches:
              raise SystemExit("Release tag does not match workspace versions: " + ", ".join(mismatches))

      # CI has built the packaged crates on this commit. Assemble fresh archives
      # here for the release, without publishing anything to crates.io.
      - name: Assemble release archives
        run: >-
          cargo package --workspace --all-features --no-verify --locked
          --exclude zengpu-dx12 --exclude zengpu-opengl --exclude zengpu-conformance --exclude zengpu-tile
          --target-dir target/release-packages

      - name: Generate release notes
        run: bash .github/release-notes.sh "$GITHUB_REF_NAME" > release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE_FLAG=""
          echo "$RELEASE_TAG" | grep -q -- "-" && PRERELEASE_FLAG="--prerelease"
          gh release create "$RELEASE_TAG" \
            target/release-packages/package/*.crate \
            --title "ZenGPU $RELEASE_TAG" \
            --notes-file release_notes.md \
            $PRERELEASE_FLAG
